name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classcue-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version from Gradle
        id: version
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "apk=ClassCue-$name-debug-arm64-v8a.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Building ClassCue $name ($code)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable APK signing key (optional)
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.CLASSCUE_APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.CLASSCUE_APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.CLASSCUE_APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.CLASSCUE_APK_KEY_PASSWORD }}
        run: |
          if [ -z "$APK_KEYSTORE_BASE64" ]; then
            echo "::warning title=One-off signing key::CLASSCUE_APK_KEYSTORE_BASE64 is not configured. This APK is signed with a throwaway debug key and cannot update earlier releases in place."
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$APK_STORE_PASSWORD" ] || [ -z "$APK_KEY_ALIAS" ] || [ -z "$APK_KEY_PASSWORD" ]; then
            echo "::error::CLASSCUE_APK_KEYSTORE_BASE64 is set, but the store password, key alias or key password secret is missing."
            exit 1
          fi
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/classcue-apk.jks"
          echo "CLASSCUE_APK_STORE_FILE=$RUNNER_TEMP/classcue-apk.jks" >> "$GITHUB_ENV"
          echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build APK
        env:
          CLASSCUE_APK_STORE_PASSWORD: ${{ secrets.CLASSCUE_APK_STORE_PASSWORD }}
          CLASSCUE_APK_KEY_ALIAS: ${{ secrets.CLASSCUE_APK_KEY_ALIAS }}
          CLASSCUE_APK_KEY_PASSWORD: ${{ secrets.CLASSCUE_APK_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare distributable files
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          rm -f "$RUNNER_TEMP/classcue-apk.jks"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' > dist/SIGNING_CERT_SHA256.txt
          if [ ! -s dist/SIGNING_CERT_SHA256.txt ]; then
            echo "::error::Could not read the APK signing certificate"
            exit 1
          fi
          echo "Signing certificate SHA-256: $(cat dist/SIGNING_CERT_SHA256.txt) (stable=$STABLE_SIGNING)"
          cd dist
          sha256sum "$APK" > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassCue-${{ steps.version.outputs.name }}-debug-arm64-v8a
          path: dist/*
          if-no-files-found: error

      # A Release is created only when release-notes/v<versionName>.md exists and the tag is new,
      # so ordinary pushes to main build artifacts without publishing anything.
      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          tag="v$VERSION"
          notes="release-notes/$tag.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its published APK unchanged."
            exit 0
          fi
          if [ ! -f "$notes" ]; then
            echo "::notice::$notes not found; built workflow artifacts only, no Release created."
            exit 0
          fi
          cp "$notes" "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "## 签名与升级"
            echo
            if [ "$STABLE_SIGNING" = "true" ]; then
              echo "- 本 APK 使用项目固定的测试签名证书，证书 SHA-256：\`$(cat dist/SIGNING_CERT_SHA256.txt)\`。之后使用同一证书发布的版本可以直接覆盖升级。"
            else
              echo '- 注意：本 APK 由 CI 临时生成的调试证书签名，不能覆盖安装之前的任何版本。升级前请先在“历史记录”中导出需要保留的录音和 Markdown，再卸载旧版。'
            fi
          } >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "ClassCue $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "dist/$APK" \
            dist/SHA256SUMS.txt \
            dist/SOURCE_COMMIT.txt \
            dist/SIGNING_CERT_SHA256.txt
