name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classcue-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare distributable files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClassCue-0.2.3p-debug-arm64-v8a.apk
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          cd dist
          sha256sum ClassCue-0.2.3p-debug-arm64-v8a.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassCue-0.2.3p-debug-arm64-v8a
          path: dist/*
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.3p
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its signed artifact unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "ClassCue 0.2.3p" \
              --notes $'## 本次更新\n\n- 版本由 `0.2.2p` 迭代至 `0.2.3p`。\n- 新增可直接下载安装的 Android APK。\n- 新增 GitHub Actions 自动测试、Lint、APK 构建与 Release 发布。\n- 新增 APK 的 SHA-256 校验文件和对应源码提交记录。\n\n## 当前功能\n\n- 课堂音频本地录制与离线实时转写。\n- 点名、提问表达及自定义强提醒词识别。\n- 高优先级通知、震动强度调节与课堂上下文捕获。\n- 多个兼容 OpenAI Chat Completions 的 AI 服务并行回答。\n- 录音、转写、提醒与 AI 回答本地历史记录。\n- 离线语音模型下载、暂停、断点续传及失败重试。' \
              dist/ClassCue-0.2.3p-debug-arm64-v8a.apk \
              dist/SHA256SUMS.txt \
              dist/SOURCE_COMMIT.txt
          fi
