name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classcue-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare distributable files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClassCue-0.2.4p-debug-arm64-v8a.apk
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          cd dist
          sha256sum ClassCue-0.2.4p-debug-arm64-v8a.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassCue-0.2.4p-debug-arm64-v8a
          path: dist/*
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.4p
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its signed artifact unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "ClassCue 0.2.4p" \
              --notes $'## 本次更新\n\n- 新增面向远距离课堂声音的离线自适应增益与软限幅。\n- 新增系统自动、手机内置和外置麦克风输入策略。\n- 课堂文字和 WAV 录音改为长期本机保留、手动删除。\n- 新增按单节课、当前课程或全部课程导出 Markdown。\n- 新增按课程和课次整理的本地归档。\n\n## 说明\n\n- 远场增强只作用于离线识别输入，原始 WAV 保持不变。\n- 原始录音不会上传给 AI 服务；AI 仍只接收用户配置服务所需的文字上下文。\n- 远距离、回声和多人重叠说话仍会影响识别，软件增强不能恢复麦克风未采集到的语音。' \
              dist/ClassCue-0.2.4p-debug-arm64-v8a.apk \
              dist/SHA256SUMS.txt \
              dist/SOURCE_COMMIT.txt
          fi
