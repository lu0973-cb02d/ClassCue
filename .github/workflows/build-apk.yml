name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classcue-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare distributable files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClassCue-0.2.5-debug-arm64-v8a.apk
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          cd dist
          sha256sum ClassCue-0.2.5-debug-arm64-v8a.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassCue-0.2.5-debug-arm64-v8a
          path: dist/*
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.5
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its signed artifact unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "ClassCue 0.2.5" \
              --notes $'## 识别稳定性优化\n\n- 临时转写只更新界面，提醒改为等待最终转写结果，降低远场噪声和吐字不清造成的误报。\n- 为识别输入加入保守的分帧能量门控和语音停顿保护，原始 WAV 继续完整保存。\n- 缩短采集块并延长端点等待，减少自然停顿造成的断句和漏识别。\n- 收紧泛化课堂问题的判定，模糊的单词片段不再直接触发提醒。\n\n## 继承自 0.2.4f\n\n- 修复 `0.2.4p` 启动时读取课次归档 SQL 拼接错误导致的打开即闪退。\n- 远场离线识别增强和麦克风输入策略。\n- 课堂文字与 WAV 长期本机保留、手动删除。\n- 按课次、课程或全部课程导出 Markdown。' \
              dist/ClassCue-0.2.5-debug-arm64-v8a.apk \
              dist/SHA256SUMS.txt \
              dist/SOURCE_COMMIT.txt
          fi
